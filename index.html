<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFlow Tool | AI Automation Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="bg-indigo-600 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-xl w-full bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 text-slate-800">
        <!-- Logo -->
        <div class="flex items-center gap-3 text-indigo-600 mb-10">
            <div class="bg-indigo-600 p-2 rounded-xl text-white">
                <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
            </div>
            <span class="text-2xl font-black tracking-tight uppercase">AgentFlow</span>
        </div>

        <!-- Initial View -->
        <div id="setup-view">
            <h1 class="text-4xl font-extrabold mb-4 leading-[1.1] tracking-tight text-slate-900">Get your AI automation plan.</h1>
            <p class="text-slate-500 mb-10 text-lg">Select your industry and we'll design an autonomous agent workflow for your business.</p>
            
            <div class="grid gap-3 mb-10">
                <button onclick="setType('ecom')" class="biz-btn w-full p-5 rounded-2xl border-2 font-bold text-left transition-all flex justify-between items-center group border-indigo-600 bg-indigo-50 text-indigo-600" id="btn-ecom">
                    <span>E-Commerce Growth</span>
                    <i data-lucide="shopping-cart" class="w-5 h-5 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                </button>
                <button onclick="setType('saas')" class="biz-btn w-full p-5 rounded-2xl border-2 font-bold text-left transition-all flex justify-between items-center group border-slate-100 text-slate-400" id="btn-saas">
                    <span>SaaS Onboarding</span>
                    <i data-lucide="layers" class="w-5 h-5 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                </button>
                <button onclick="setType('agency')" class="biz-btn w-full p-5 rounded-2xl border-2 font-bold text-left transition-all flex justify-between items-center group border-slate-100 text-slate-400" id="btn-agency">
                    <span>Agency Lead Gen</span>
                    <i data-lucide="briefcase" class="w-5 h-5 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                </button>
            </div>

            <button onclick="generate()" id="gen-btn" class="w-full bg-indigo-600 text-white py-6 rounded-[1.5rem] text-xl font-black hover:bg-indigo-700 transition-all flex items-center justify-center gap-2 shadow-xl shadow-indigo-100">
                Generate Plan <i data-lucide="arrow-right"></i>
            </button>
        </div>

        <!-- Result View -->
        <div id="result-view" class="hidden animate-fade">
            <div class="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full inline-flex items-center gap-2 mb-6 font-bold text-sm">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Strategy Ready
            </div>
            <h2 class="text-3xl font-black mb-8 text-indigo-600 leading-tight" id="res-title"></h2>
            
            <div class="space-y-6 mb-12" id="res-steps">
                <!-- Steps injected here -->
            </div>

            <div class="border-t pt-8">
                <p class="text-slate-400 text-sm font-bold uppercase tracking-widest mb-6 text-center">Next Step</p>
                <a href="https://agentic-biz.vercel.app" class="w-full bg-slate-900 text-white py-6 rounded-2xl font-black text-center hover:bg-slate-800 transition-all flex items-center justify-center gap-3 shadow-xl">
                    <i data-lucide="bot" class="w-6 h-6"></i> Find These Agents
                </a>
                <button onclick="location.reload()" class="w-full text-slate-400 mt-4 font-bold text-sm hover:text-slate-600 transition-colors underline">Generate Another</button>
            </div>
        </div>
    </div>
    
    <p class="mt-8 text-indigo-200 text-sm font-medium">© 2024 Synthetix Labs. Built for the autonomous future.</p>

    <script>
        lucide.createIcons();
        let selected = 'ecom';
        const workflows = {
            ecom: { 
                title: "The E-Comm Revenue Multiplier", 
                steps: [
                    { icon: "search", t: "Cart Recovery Agent", d: "Monitors abandonments and sends personalized offers via SMS." },
                    { icon: "message-square", t: "Product Concierge", d: "Autonomous AI chat that answers sizing and shipping questions 24/7." },
                    { icon: "trending-up", t: "Upsell Agent", d: "Analyzes purchase history to auto-generate custom bundle deals." }
                ] 
            },
            saas: { 
                title: "The Zero-Churn SaaS Onboarding", 
                steps: [
                    { icon: "user-plus", t: "Setup Guide Agent", d: "Walks new users through the dashboard based on their job title." },
                    { icon: "alert-circle", t: "Friction Detector", d: "Flags users who haven't logged in for 3 days and sends re-engagement." },
                    { icon: "mail", t: "expansion Agent", d: "Identifies power users and drafts upgrade emails for your sales team." }
                ] 
            },
            agency: { 
                title: "The High-Ticket Lead Machine", 
                steps: [
                    { icon: "globe", t: "Scraper Agent", d: "Finds companies that just raised funding or hired a new CEO." },
                    { icon: "eye", t: "Insight Agent", d: "Researches their current tech stack and identifies pain points." },
                    { icon: "send", t: "Outreach Agent", d: "Drafts hyper-personalized cold emails that sound 100% human." }
                ] 
            }
        };

        function setType(type) {
            selected = type;
            document.querySelectorAll('.biz-btn').forEach(b => {
                b.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                b.classList.add('border-slate-100', 'text-slate-400');
            });
            const active = document.getElementById('btn-' + type);
            active.classList.replace('border-slate-100', 'border-indigo-600');
            active.classList.add('bg-indigo-50', 'text-indigo-600');
        }

        function generate() {
            const btn = document.getElementById('gen-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('setup-view').classList.add('hidden');
                document.getElementById('result-view').classList.remove('hidden');
                document.getElementById('res-title').innerText = workflows[selected].title;
                
                const stepBox = document.getElementById('res-steps');
                workflows[selected].steps.forEach((s, i) => {
                    stepBox.innerHTML += `
                        <div class="flex gap-5 items-start animate-fade" style="animation-delay: ${i * 0.2}s">
                            <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center shrink-0 text-indigo-600">
                                <i data-lucide="${s.icon}" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-900">${s.t}</h4>
                                <p class="text-slate-500 text-sm leading-relaxed">${s.d}</p>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            }, 1000);
        }
    </script>
</body>
</html>
